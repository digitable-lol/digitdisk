#
# ЭТО ДАННЫЕ, А НЕ КОД. Файл читается при запуске, правится без пересборки и
# заменяется своим: `--places ФАЙЛ` либо ~/.config/digitdisk/places.conf.
# Посмотреть, что вышло, и сколько из этого есть на машине: `digitdisk places`.
#
# ОТКУДА ВЗЯТ КАЖДЫЙ РЯД. Из документации самого инструмента, и она названа
# последним полем. Ни одна строка не списана с чужого чистильщика: совпадения
# неизбежны — места объективны, — но источник у каждой строки свой и проверяем.
# Правило отбора одно: место попадает сюда, только если его собственная
# документация называет его кэшем, журналом или производными данными, которые
# инструмент восстановит сам.
#
# ЧЕГО ЗДЕСЬ НАМЕРЕННО НЕТ, и это не забывчивость:
#   • хранилище pnpm (~/.local/share/pnpm/store) и кэш модулей Go
#     (~/go/pkg/mod) — их содержимое втянуто в проекты жёсткими ссылками, а
#     файлы лежат «только для чтения»; поштучный вынос ломает проект, а не
#     освобождает место;
#   • локальный репозиторий Maven (~/.m2/repository) — там же лежит то, что
#     собрано и установлено локально и не лежит ни в одном удалённом;
#   • хранилища образов контейнеров и nix/guix — они адресуются содержимым, и
#     ядро отказывается их трогать само (постусловие И3);
#   • почта, базы, снимки виртуальных машин — это не кэш ни при каком объёме.
#
# ФОРМАТ, семь полей через «|», лишние пробелы по краям снимаются:
#
#   разряд | якорь | система | путь | переменная | имя | источник
#
#   разряд      кэш | журнал | сборка | загрузка
#               «крупное» и «неизвестное» справочнику запрещены: их решает
#               размер, и назвать их местом значило бы соврать о причине.
#   якорь       дом       — от домашнего каталога
#               кэш       — от $XDG_CACHE_HOME, иначе ~/.cache
#               данные    — от $XDG_DATA_HOME, иначе ~/.local/share
#               настройки — от $XDG_CONFIG_HOME, иначе ~/.config
#               корень    — абсолютный путь
#               всюду     — цепочка составляющих на любой глубине
#   система     linux | macos | все
#   путь        составляющие через «/», без ведущей и хвостовой косой.
#               ДВОЙНАЯ косая «//» делит путь на основание и хвост: основание —
#               то, что переносит переменная окружения, хвост остаётся как есть.
#               `.npm//_cacache` без переменной даёт `~/.npm/_cacache`, а при
#               заданном npm_config_cache — `$npm_config_cache/_cacache`.
#   переменная  переменная окружения, переносящая ОСНОВАНИЕ (всё до «//», а нет
#               «//» — весь путь). Пусто — место никуда не переносится.
#   имя         человеку: чей это каталог и что в нём
#   источник    страница документации инструмента, где это написано
#
# Порядок строк — часть смысла: побеждает ПЕРВОЕ подошедшее место, поэтому
# частное стоит выше общего.

