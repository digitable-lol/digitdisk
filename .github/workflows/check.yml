# Проверки digitdisk на каждый толчок.
#
# ЗАЧЕМ ЗДЕСЬ МАК. Разбор структур, которыми отвечает macOS, написан по
# заголовкам Apple на машине, которая маком не является. Проверить раскладку
# можно только на маке — и вот он: у публичных репозиториев маковские бегунки
# GitHub бесплатны и без лимита минут, потолок только на одновременность
# (5 маковских задач на планах Free/Pro/Team). Поэтому здесь не «собралось», а
# «снялось»: тесты с признаком darwin сверяют каждую раскладку с тем, что
# машина знает о себе сама, а потом снимок снимается и в нём ищутся числа.
#
# Проверить синтаксис, не запуская:  python3 -c 'import yaml,sys; yaml.safe_load(open(sys.argv[1]))' .github/workflows/check.yml
name: Проверки

# Ключ в кавычках нарочно: без них разборщик YAML 1.1 читает «on» как
# логическую истину. GitHub принимает обе записи одинаково.
"on":
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.5"
  # ВЕРСИЯ КОМПИЛЯТОРА ЗАКРЕПЛЕНА, и это не осторожность, а условие того, чтобы
  # сверка печати проверяла то, что обещает.
  #
  # Шаг ниже клонировал master языка. Язык живёт своей жизнью и меняет, среди
  # прочего, нумерацию временных в напечатанном коде: `t700` против `t686`,
  # `e413` против `e399`. От этого цель `сверка` краснела сама собой, а её
  # собственный комментарий продолжал уверять, что «расхождение значит, что
  # кто-то правил вывод компилятора руками». Руками никто не правил — просто
  # компилятор в прогоне был не тем, которым напечатано дерево.
  #
  # Теперь берётся ВЫПУЩЕННЫЙ тег: тот же двоичный, что ставится формулой, и
  # тот же, которым перепечатано ui-flang/out-go. Язык выпустил новую версию —
  # тег здесь поднимается ОДНОЙ правкой вместе с перепечаткой, и это видно в
  # истории, а не случается молча между двумя прогонами.
  FLANG_TAG: "v0.7.10"

jobs:
  linux:
    name: Linux — сборка без cgo, тесты, кросс-сборка под macOS
    runs-on: ubuntu-latest
    steps:
      # submodules: раскладка экрана подключена подмодулем ui-flang/flang-tui.
      # Напечатанный Go лежит в дереве и без подмодуля, поэтому СБОРКА без него
      # прошла бы; а вот `make -C ui-flang` — нет, и молчаливо зелёный прогон
      # без исходника раскладки хуже красного.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false

      # Шаг звал `python3 tools/check-licensing.py` — файла, которого в дереве
      # нет с 1 сентября: сторож переписан на flang, а Python из дерева ушёл.
      # То есть проверка была мёртвой. Компилятор flang — один двоичный файл,
      # которому нужен только `cc`, поэтому он и собирается здесь из своего же
      # клона, как написано в README.
      - name: Компилятор flang
        run: |
          git clone --depth 1 --branch "$FLANG_TAG" https://github.com/digitable-lol/flang.git /tmp/flang-src
          make -C /tmp/flang-src/bootstrap
          "/tmp/flang-src/bootstrap/flang" --version
          echo "/tmp/flang-src/bootstrap" >> "$GITHUB_PATH"

      - name: Лицензионный сторож
        run: flang io tools/licensing.flang

      - name: Ядро на flang — проверка, примеры и сверка двух печатей
        run: make -C core

      - name: Раскладка экрана на flang — проверка, печать и сверка печати с деревом
        # `сверка` перепечатывает во временный каталог и сравнивает с тем, что
        # лежит в дереве: так ловится правка руками внутри ui-flang/out-go.
        run: |
          make -C ui-flang проверка
          make -C ui-flang сверка

      - name: Проверки хозяина
        # `-count=1` не украшение. Сверка ключей и подкоманд читает
        # ../digitdisk.1 и ../digitdisk.en.1 — файлы вне модуля, которых кэш
        # `go test` не отслеживает: правка одной только страницы оставила бы
        # засчитанным прошлый зелёный прогон, и расхождение уехало бы в выпуск
        # молча. Тем же прогоном проверяется полнота перевода: строка без пары
        # на втором языке роняет `go test ./internal/lang/`.
        run: |
          test -z "$(gofmt -l host core/out-go ui-flang/out-go)" || { gofmt -l host core/out-go ui-flang/out-go; exit 1; }
          cd host
          go vet ./...
          go vet -tags flangcore ./...
          go vet -tags flangcore,flangui ./...
          go test -count=1 ./...
          go test -count=1 -tags flangcore ./...
          go test -count=1 -tags flangcore,flangui ./...

      - name: Две раскладки печатают один и тот же экран
        # Раскладка экрана есть в двух реализациях — рукописный Go и печатанный
        # flang, — а одна сборка держит только одну. Сравнить их можно лишь
        # двумя прогонами одного дерева, и это делает скрипт: снимки кадров на
        # ширинах 40/80/120/200, вывод в трубу, --json и живой экран в pty.
        run: tools/sverka-ui.sh

      - name: Маковский хозяин собирается отсюда
        # Ради этой строки маковская половина и написана без cgo: обе цели
        # собираются с Linux, выключенным CGO и повторимым отпечатком.
        run: |
          cd host
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build ./...
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build ./...
          CGO_ENABLED=0 GOOS=darwin go vet ./...

      - name: Дерево чистое
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "Проверки наследили в дереве." >&2
            exit 1
          fi

  macos:
    name: macOS ${{ matrix.runner }} — снимок снимается по-настоящему
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest — Apple Silicon; вторая цель выпуска, x86-64, живёт на
        # отдельном образе (GitHub сворачивает маковский Intel осенью 2027).
        runner: [macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false

      - name: IOKit без cgo — что реестр отдаёт про видеокарты
        # Замер, а не обещание: тест сверяет model из IORegistry с hw.model из
        # sysctl (расходятся — значит дверь открылась не туда), а потом целиком
        # печатает, что этот мак публикует про свои видеокарты. Вывод шага и
        # есть ответ задачи 4544.
        run: |
          cd host
          go test -count=1 -v -run 'Дверь|Типы|MatchingServices' ./internal/iokit/

          # А теперь то же самое через собранного хозяина: раздел ВИДЕОКАРТЫ
          # на маке был пуст, и пуст он или нет — видно только по снимку.
          # Проверка по --json, потому что JSON не переводится.
          go build -o "$RUNNER_TEMP/digitdisk-iokit" .
          "$RUNNER_TEMP/digitdisk-iokit" status --sample 1 --json > "$RUNNER_TEMP/iokit.json"
          jq '.gpus' "$RUNNER_TEMP/iokit.json"
          n=$(jq '.gpus | length' "$RUNNER_TEMP/iokit.json")
          echo "карт в снимке: $n"
          [ "$n" -ge 1 ] || { echo "Раздел ВИДЕОКАРТЫ по-прежнему пуст." >&2; exit 1; }

          # Карта приехала — а вместе с ней могло приехать и объяснение.
          # Тот же сторож, что стоит ниже на весь снимок, но здесь он
          # доходит до дела, даже когда шаг с тестами красный по чужой
          # причине.
          "$RUNNER_TEMP/digitdisk-iokit" status --sample 1 > "$RUNNER_TEMP/iokit-status.txt"
          sed -n '/ВИДЕОКАРТ/,/^$/p;/VIDEO CARD/,/^$/p' "$RUNNER_TEMP/iokit-status.txt"
          if grep -nE 'Mach|cgo|sysctl|IOKit|libproc|host_statistics|proc_pidinfo' "$RUNNER_TEMP/iokit-status.txt"; then
            echo "Вместе с картой в снимок приехало объяснение." >&2
            exit 1
          fi

      - name: Тесты, включая те, которым нужен мак
        # Здесь исполняются host/internal/sysinfo/sysinfo_darwin_test.go: они
        # сверяют раскладку каждой структуры с тем, что процесс знает о себе.
        run: |
          cd host
          go vet ./...
          go test -v -run 'Darwin|OnThisMac|AreMeasured' ./internal/sysinfo/
          go test -count=1 ./...

      - name: Снимок содержит числа, а не прочерки
        # ЯЗЫК СНИМКА ЗАДАЁТСЯ, А НЕ НАСЛЕДУЕТСЯ, и это не мелочь оформления.
        #
        # Прежняя редакция шага брала снимок на языке машины и искала в нём
        # РУССКИЕ слова с АНГЛИЙСКОЙ десятичной точкой («занято ЦП 10.7%») —
        # сочетание, которого инструмент не печатает ни на одном языке с тех
        # пор, как заговорил на двух: слова стали зависеть от языка, а
        # разделитель дробной части — тоже (10,7% против 10.7%). На маковском
        # бегунке LANG не задан, язык по умолчанию английский, и шаг три дня
        # докладывал «НЕТ ЧИСЛА» о числах, стоявших в той же строке журнала.
        # Числа при этом снимались и снимаются: их проверяет шаг выше,
        # TestProcessesAreMeasured на живой машине.
        #
        # Поэтому здесь `--lang`, и обе редакции сразу: дерево обещает полный
        # перевод, и снимок, полный по-русски и пустой по-английски, —
        # сломанный снимок.
        #
        # Образцы ниже сверяются с печатью на Linux: host/snapshot_numbers_test.go
        # читает ЭТОТ файл, печатает снимок, в котором всё замерено, и валится,
        # если хоть один образец отсюда в нём не находится. Так строка здесь не
        # разойдётся с переводом молча ещё раз.
        run: |
          cd host
          go build -o "$RUNNER_TEMP/digitdisk" .
          mkdir -p "$RUNNER_TEMP/snapshot" "$RUNNER_TEMP/nothing"
          for l in ru en; do
            # Без трубы нарочно: `| tee` отдаёт код возврата tee, и упавший
            # снимок доехал бы сюда пустым файлом и молчаливым нулём.
            "$RUNNER_TEMP/digitdisk" status --sample 300 --lang "$l" > "$RUNNER_TEMP/snapshot/status.$l.txt"
            cat "$RUNNER_TEMP/snapshot/status.$l.txt"
            : > "$RUNNER_TEMP/nothing/status.$l.txt"
          done

          # need  — строка ОБЯЗАНА нести число: это то, что на маке снимается.
          # named — строка ОБЯЗАНА назвать словом то, чего на маке взять нечем:
          #         непокрытое называется, а не выдаётся за поломку.
          # Обе смотрят в $WHERE, чтобы одного и того же сторожа можно было
          # натравить и на снимок, и на заведомо пустой файл.
          need() {
            total=$((total + 1))
            grep -qE "$2" "$WHERE/status.$1.txt" || { echo "НЕТ ЧИСЛА [$1]: $3" >&2; bad=$((bad + 1)); }
          }
          named() {
            total=$((total + 1))
            grep -qE "$2" "$WHERE/status.$1.txt" || { echo "НЕ НАЗВАНО [$1]: $3" >&2; bad=$((bad + 1)); }
          }
          guard() {
            total=0
            bad=0
            need ru 'занято ЦП     [0-9]+,[0-9]%' 'доля занятого процессора'
            need ru 'свободно      [0-9]' 'свободная память'
            need ru 'кэш/буферы    [0-9]' 'файловый кэш'
            need ru 'доступно      [0-9]' 'доступная память'
            need ru 'закреплённая  [0-9]' 'закреплённая память'
            need ru 'сжатая        [0-9]' 'сжатая память'
            need ru 'потоков [0-9]' 'число потоков'
            need ru 'выполняется [0-9]' 'сколько процессов работает'
            need ru '  десятка по памяти:' 'десятка по памяти'
            need ru '^ +[0-9]+ [^ ]+ +[0-9]+,[0-9] [КМГТ]иБ  ' 'в десятке по памяти стоит размер'
            need ru '  десятка по процессору:' 'десятка по процессору'
            need ru '^ +[0-9]+ [^ ]+ +[0-9]+,[0-9]%  ' 'в десятке по процессору стоит доля'
            need en 'CPU busy      [0-9]+\.[0-9]%' 'доля занятого процессора'
            need en 'free          [0-9]' 'свободная память'
            need en 'cache/buffers [0-9]' 'файловый кэш'
            need en 'available     [0-9]' 'доступная память'
            need en 'wired         [0-9]' 'закреплённая память'
            need en 'compressed    [0-9]' 'сжатая память'
            need en 'threads [0-9]' 'число потоков'
            need en 'running [0-9]' 'сколько процессов работает'
            need en '  top ten by memory:' 'десятка по памяти'
            need en '^ +[0-9]+ [^ ]+ +[0-9]+\.[0-9] [KMGT]iB  ' 'в десятке по памяти стоит размер'
            need en '  top ten by processor:' 'десятка по процессору'
            need en '^ +[0-9]+ [^ ]+ +[0-9]+\.[0-9]%  ' 'в десятке по процессору стоит доля'
            named ru 'НЕ ИЗМЕРЕНО .*заблокированные процессы' 'заблокированные процессы'
            named ru 'НЕ ИЗМЕРЕНО .*датчики температуры' 'датчики температуры'
            named en 'NOT MEASURED .*blocked processes' 'заблокированные процессы'
            named en 'NOT MEASURED .*temperature sensors' 'датчики температуры'
            # Приговор выносится по $bad ниже, а не кодом возврата: шаг идёт
            # под `bash -e`, и сторож, который вернул бы ненулевой код на
            # отрицательном контроле, оборвал бы прогон до самой проверки.
            return 0
          }

          # ОТРИЦАТЕЛЬНЫЙ КОНТРОЛЬ, и он здесь ровно потому, что беда была
          # именно такой: сторож, который не умеет упасть, три дня выглядел
          # работающим. На пустом снимке обязан заругаться КАЖДЫЙ образец —
          # не «хотя бы один»: образец, срабатывающий на пустоте, проверяет
          # не число, а собственную формулировку.
          WHERE="$RUNNER_TEMP/nothing"
          guard 2>/dev/null
          if [ "$bad" -ne "$total" ]; then
            echo "На пустом снимке смолчали $((total - bad)) образцов из $total." >&2
            echo "Эти образцы ничего не проверяют — их надо чинить, а не зеленить." >&2
            exit 1
          fi
          echo "отрицательный контроль: на пустом снимке ругаются все $total образцов"

          # А теперь приговор — по настоящему снимку.
          WHERE="$RUNNER_TEMP/snapshot"
          guard
          echo "проверено образцов: $total, не нашлось: $bad"
          exit $(( bad > 0 ))

      - name: В выводе нет инженерного дневника
        # Сторож против того, ради чего всё это и переписано: пользователю —
        # число или прочерк, а объяснения — только по `--why`. Смотрит в ОБЕ
        # редакции: имя системного вызова одинаково выглядит на любом языке, а
        # приехать в снимок может через любую из двух половин словаря.
        run: |
          cd host
          if grep -nE 'Mach|cgo|sysctl|IOKit|libproc|host_statistics|proc_pidinfo|kinfo_proc|KERN_PROCARGS' \
              "$RUNNER_TEMP/snapshot/status.ru.txt" "$RUNNER_TEMP/snapshot/status.en.txt"; then
            echo "В снимке снова объяснения вместо чисел." >&2
            exit 1
          fi
          "$RUNNER_TEMP/digitdisk" status --why --lang ru
          "$RUNNER_TEMP/digitdisk" status --why --lang en
          "$RUNNER_TEMP/digitdisk" status --json > /dev/null
